<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House Menu</title>
  <link rel="stylesheet" href="./scss/main.scss" />
</head>
<body>
  

  <div class="container" >
    <header class="header" >

      <div class="wrap" >

         <div class="header__container">
          <div class="header__logo-container">

            <a class="header__logo"
              href="https://www.figma.com/design/yuc5s9NCc4jENkk5LdFfvX/Coffee-House-2026Q3?node-id=0-1&t=8rul1DTtoDgR8Rzj-1"
              target="_blank" rel="noopener noreferrer">
              <img class="header__logo-img" src="./assets/isons/header-section/logo.svg" alt="coffee house" />
            </a>
          </div>

          <div class="header__nav-container">

            <nav class="header__nav">
              <a href="#" class="header__nav-item"> Favorite coffee </a>

              <a href="#" class="header__nav-item"> Mobile app </a>

              <a href="#" class="header__nav-item"> Contact us </a>
            </nav>
          </div>


          <div class="header__buttons-container">

            <button class="header__button">

              <span class=" header__togle-icon">

                <img src="./assets/isons/header-section/header-buttons/light-theme.svg" class="header__togle-light" />
              </span>

              <span class="header__togle-icon">

                <img src="./assets/isons/header-section/header-buttons/dark-theme.svg" class="header__togle-dark" />
              </span>

            </button>

          <div class="header__button-underline" >

            <a class="header__button-menu  header__menu-section" href="#" target="_blank" rel="noopener noreferrer" >
              Menu
              <img src="./assets/isons/header-section/header-buttons/menu__coffee-cup.svg" alt="coffee_cup-icon" />
  
            </a>

            <span class="header__button-line" ></span>
          </div>


          </div>


        </div>
      </div>

      </div>

    </header>

    <main class="main" >

    </main>
