<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee House</title>
  <link rel="stylesheet" href="./scss/main.scss" />
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="wrap">
        <div class="header__container">
          <div class="header__logo-container" >

            <a class="header__logo"
              href="https://www.figma.com/design/yuc5s9NCc4jENkk5LdFfvX/Coffee-House-2026Q3?node-id=0-1&t=8rul1DTtoDgR8Rzj-1"
              target="_blank" rel="noopener noreferrer">
              <img class="header__logo-img" src="./assets/isons/header-section/logo.svg" alt="coffee house" />
            </a>
          </div>

          <div class="header__nav-container" >

            <nav class="header__nav">
              <a src="#" class="header__nav-item"> Favorite coffee </a>
  
              <a src="#" class="header__nav-item"> Mobile app </a>
  
              <a src="#" class="header__nav-item"> Contact us </a>
            </nav>
          </div>


          <div class="header__buttons-container" >

            <button class="header__button">
  
              <span  class=" header__togle-icon" >
  
                <img src="./assets/isons/header-section/header-buttons/light-theme.svg"
                  class="header__togle-light"/>
              </span>
  
              <span  class="header__togle-icon" >
  
                <img src="./assets/isons/header-section/header-buttons/dark-theme.svg"
                  class="header__togle-dark" />
              </span>
  
            </button>

            <a class="header__button-menu" >
                Menu
                <img  src="./assets/isons/header-section/header-buttons/menu__coffee-cup.svg" alt="coffee_cup-icon"/>

            </a>

          </div>


        </div>
      </div>
  </div>
  </header>

  <main>

   <section class="main" >

    <div class="wrap" >

      <div class="main__container" >

        <div class="main__content-container" >

          <div class="main__text" >

            <h1 class="main__text-header" >
              <span>Enjoy </span> premium coffee at our charming cafe
            </h1>

            <p class="main__text-paragraph" >
              With its inviting atmosphere and delicious coffee options, the Coffee House Resource is a popular destination for coffee lovers and those seeking a warm and inviting space to enjoy their favorite beverage.
            </p>

            <a class="main__text-button" >
              Menu
            </a>

          </div>

        </div>

      </div>

    </div>

   </section>

  </main>
  </div>
</body>

</html>
